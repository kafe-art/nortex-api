[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nortex-api"
version = "0.1.0"
description = "Backend web de NORTEX: parcelas, datos locales (ANA, Junta, SENAMHI) y evaluación F1/F2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "shapely>=2.0",
    # Módulo de datos (rama con las fuentes de las decisiones y la opción historico=True)
    "nortex-data @ git+https://github.com/kafe-art/nortex-data-brytnei.git@feat/variables-decisiones",
    # Motor físico y de evaluación (repositorio privado: requiere acceso)
    "nortex-motor @ git+https://github.com/kafe-art/nortex-motor.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools]
packages = ["nortex_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
