[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nortex-api"
version = "0.1.0"
description = "Backend web de NORTEX: parcelas, datos locales (ANA, Junta, SENAMHI) y evaluación F1/F2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "shapely>=2.0",
    # Módulo de datos del equipo, versión fija: v0.6.1 es la primera con las 14 fuentes,
    # get_dataset(..., aoi_path=, historico=) y el respaldo público de IMERG.
    # NO usar el paquete antiguo de kafe-art/nortex-data (solo POWER, parámetro aoi_file).
    "nortex-data @ git+https://github.com/BRYTNEI/nortex-data.git@v0.6.1",
    # Motor físico y de evaluación
    "nortex-motor @ git+https://github.com/kafe-art/nortex-motor.git@main",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools]
packages = ["nortex_api"]

[tool.setuptools.package-data]
nortex_api = ["web/*", "web/visuales/*.js", "web/escenas/*.js"]   # frontend servido en /app, con sus módulos

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
