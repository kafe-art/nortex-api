# Despliegue gratuito en Render (https://render.com) con el Dockerfile de este repositorio.
# Para no requerir tarjeta de crédito, usa en Render: New + → Web Service → elegir kafe-art/nortex-api → Plan Free.
# La imagen ya incluye la parcela de prueba `ejemplo_sl` con sus series satelitales en `/datos_semilla`.
services:
  - type: web
    name: nortex-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /salud
    envVars:
      - key: NORTEX_API_DATA
        value: /datos
      - key: NORTEX_CORS          # dominios del frontend si se publica aparte (separados por comas)
        value: "*"
      - key: EARTHDATA_TOKEN      # opcional: IMERG por OPeNDAP (si falta, se usa la copia pública)
        sync: false
