name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
# Las pruebas requieren nortex-motor (repositorio privado): ejecutarlas en local con
#   pip install -e ".[dev]" && pytest
# o agregar un token con acceso a kafe-art/nortex-motor como secreto del repositorio.
